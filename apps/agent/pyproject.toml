[project]
name = "voiceai-agent"
version = "0.1.0"
description = "Voice receptionist conversation core and booking-service tools"
requires-python = ">=3.11,<3.14"
dependencies = ["livekit-agents[silero]>=1.8.6,<1.9", "python-dotenv>=1.1,<2"]

[project.scripts]
voiceai-agent = "voiceai_agent.worker:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
